<title>Siluetas POS</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-build" content="1788526186724">
<script>
(function(){
  try{
    var current = document.querySelector('meta[name="app-build"]').content;
    fetch('./version.txt?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : null; }).then(function(v){
      if(!v) return;
      v = v.trim();
      if(v && v !== current){
        location.replace(location.pathname + '?v=' + encodeURIComponent(v));
      }
    }).catch(function(){});
  }catch(e){}
})();
</script>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#434298">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#434298;
    /* Admin's own palette -- separate from the app's product-category colors so Admin can have
       its own visual identity, and (via the "Admin background" swatch in Admin > Design) can
       still be overridden per device. --admin-bg is the screen background, --admin-card is the
       row/card surface on top of it, --admin-accent is the single accent used for the active
       tab, header, row highlights, and the Kiosk-share bars. */
    --admin-bg:#36344C;
    --admin-card:#212035;
    --admin-accent:#03F2A0;
    --card:#38367B;
    --card-dark:#27245E;
    --card-mid:#3f3d8c;
    --white:#ffffff;
    --text-soft:#c9c8ea;
    --text-faint:#9d9cca;
    --accent-pink:#FF66FF;
    --accent-orange:#F9A17A;
    --accent-purple:#B458D6;
    --accent-lavender:#CC99FF;
    --accent-green:#03F2A0;
    --accent-blue:#27245E;
    --radius:12px;
    --font-title:'Lobster', cursive;
    --font-ui:'Roboto', system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#131226;color:var(--white);font-family:var(--font-ui);}
  body{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:stretch;
    justify-content:center;
    padding:0;
    background:var(--bg);
  }
  button{font-family:inherit;}
  /* REAL DEPLOYMENT ONLY: fills the whole physical kiosk screen edge-to-edge, no
     phone-mockup frame. Still capped at 480px wide (phone-first design, not
     responsive beyond that), just without the decorative rounded bezel used for the
     in-browser preview build (app.html / Cowork Artifact). */
  .device{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    background:var(--bg);
    border-radius:0;
    box-shadow:none;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    padding:56px 24px 20px;
    overflow-y:auto;
    -ms-overflow-style:none;
    scrollbar-width:none;
  }
  /* Flex items shrink by default; once a tab's content (e.g. Design/Settings) got
     tall enough to exceed the screen height, that was squashing fixed-size chrome
     like the topbar and tab bar instead of just scrolling. Nothing here should
     shrink — .screen's own overflow-y:auto is what should handle tall content. */
  .screen > *{flex-shrink:0;}
  .screen::-webkit-scrollbar{display:none;}
  .screen.active{display:flex;}
  .screen.pb-bar{padding-bottom:136px;}

  /* ---------- shared bits ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .topbar .icons{display:flex;gap:10px;}
  .icon-btn{
    width:56px;height:56px;border-radius:50%;
    border:2px solid var(--white);background:transparent;color:var(--white);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn svg{width:24px;height:24px;}
  .icon-btn.accent{border-color:var(--admin-accent);color:var(--admin-accent);} /* admin-only (the Admin topbar's home button) */
  .who{text-align:right;}
  .who .kiosk{font-family:var(--font-title);font-size:24px;line-height:1;color:var(--text-soft);}
  .who .staff{font-size:18px;color:var(--text-faint);font-style:italic;margin-top:12px;cursor:pointer;}

  .pill{
    font-family:var(--font-title);
    font-size:19px;
    color:#241f4d;
    background:var(--white);
    border:none;
    border-radius:var(--radius);
    height:45px;
    padding:0 20px;
    width:100%;
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
    margin-bottom:12px;
    text-align:left;
  }
  .pill .arrow{font-size:14px;}
  .pill.accent-pink{background:var(--accent-pink);}
  .pill.accent-orange{background:var(--accent-orange);}
  .pill.accent-purple{background:var(--accent-purple);color:#221a3a;}
  .pill.dark{background:var(--card-dark);color:var(--white);font-family:var(--font-ui);font-weight:600;font-size:15px;}

  .row-card{
    background:var(--card);
    border-radius:var(--radius);
    min-height:62px;
    padding:0 18px;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
    cursor:pointer;
    border:none;color:var(--white);width:100%;font-size:16px;text-align:left;
  }
  .row-card .price{font-weight:700;}

  /* Same border/fill accent pattern as .cart-item on the register screen (see below) — the
     payment page's order list should read as the same product colors, not a flat row. */
  .pay-item-row{
    border-radius:var(--radius);
    height:50px;
    padding:0 18px;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
    width:100%;font-size:16px;text-align:left;
    border:2px solid var(--item-accent, var(--white));
    background:transparent;
    color:var(--white);
  }
  #app.style-fill .pay-item-row{
    border-color:transparent;
    background:color-mix(in srgb, var(--item-accent, var(--white)) 45%, var(--card));
  }
  .pay-item-row .price{font-weight:700;color:var(--white);}

  .section-label{font-size:13px;color:var(--text-faint);margin:14px 0 8px;font-style:italic;}

  .cart-item{
    border-radius:var(--radius);
    min-height:52px;
    padding:0 20px;
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
    border:2px solid var(--item-accent, var(--white));
    background:transparent;
    font-size:15px;
  }
  #app.style-fill .cart-item{
    border-color:transparent;
    background:color-mix(in srgb, var(--item-accent, var(--white)) 45%, var(--card));
  }
  .cart-item .price{font-weight:700;}

  /* shared fixed bottom-bar position — used by the persistent Charge order bar
     AND Confirm payment, so both sit in the exact same place on screen */
  .fixed-bar-pos{
    position:absolute;left:24px;right:24px;bottom:72px;z-index:40;
    height:70px;padding:0 24px;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;border:none;color:var(--white);
  }
  .hidden{display:none;}

  .charge-bar{
    background:var(--card-dark);
    justify-content:center;
    font-size:17px;font-weight:600;
  }
  .charge-bar .price{font-size:19px;font-weight:800;}
  .charge-bar.ready{background:var(--accent-green);color:var(--accent-blue);}

  .global-charge-bar{
    background:var(--card-dark);
    font-family:var(--font-ui);font-style:italic;
    font-size:19px;font-weight:400;
  }
  .global-charge-bar .price{font-size:19px;font-weight:400;font-style:italic;}

  .home-btn-fixed{margin-top:6px;}

  /* ---------- login ---------- */
  #screen-login{align-items:center;text-align:center;padding-top:110px;}
  .wordmark-pink{font-family:var(--font-title);font-size:50px;color:var(--accent-pink);margin:0;line-height:1;}
  /* The logo PNG already contains BOTH the "Siluetas" script mark and the "Art Studio"
     line below it (a single flattened two-line lockup) — there is no separate text element
     for "Art Studio" any more; sizing this taller reveals both lines at once. */
  .wordmark-logo{height:147px;width:auto;display:block;margin:0 auto;}
  .pin-dots{display:flex;gap:20px;margin:82px 0 18px;}
  .pin-dot{width:45px;height:45px;border-radius:50%;border:3px solid var(--white);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:24px;font-weight:700;line-height:1;}
  .pin-dot .star{display:block;font-size:34px;line-height:1;transform:translateY(7px);}
  .pin-hint{font-family:var(--font-ui);font-style:italic;color:var(--text-soft);font-size:16px;margin-bottom:20px;}
  /* Only ever shown on a non-production host with no cached staff data (see isPreviewHost()
     in the script) — lets the design get click-tested here without a real backend connection. */
  .demo-login-link{
    background:none;border:1px solid var(--text-faint);color:var(--text-soft);
    font-family:var(--font-ui);font-size:12px;padding:8px 14px;border-radius:20px;
    cursor:pointer;margin:-24px auto 24px;display:block;
  }
  .demo-login-link:hover{color:var(--white);border-color:var(--text-soft);}
  .keypad-round{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:210px;}
  .key-round{
    aspect-ratio:1;border-radius:50%;background:var(--card);
    border:none;color:var(--white);font-family:var(--font-ui);font-weight:700;font-size:20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .key-round:active{background:var(--card-dark);}
  /* Login screen's keypad only — sized larger for real-device comfort (measured from a phone
     screenshot: 70px keys, 33px column gap, 12px row gap). The admin-PIN modal reuses the same
     .keypad-round/.key-round classes at their smaller default size, since that keypad sits inside
     a fixed-width modal box and doesn't have room for the bigger login version. */
  #screen-login .keypad-round{grid-template-columns:repeat(3,70px);column-gap:33px;row-gap:12px;width:auto;max-width:none;}
  #screen-login .key-round{font-size:22px;}
  .key-round.ghost{background:transparent;cursor:default;}

  /* ---------- home grid ---------- */
  #screen-home .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:64px;
    margin-left:67px;margin-right:67px;
  }
  .tile{
    aspect-ratio:1;border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;
    background:var(--card-dark);border:5px solid transparent;cursor:pointer;
    font-family:var(--font-title);font-size:22px;color:var(--white);
  }
  /* Entrance animation, replayed every time the Home screen becomes active (see
     playHomeEntrance()): the 4 category tiles fade + drop in from above AS ONE BLOCK (no
     stagger within the group), the 4 admin-row icon tiles fade + rise in from below as their
     own block. Admin > Settings can turn this off entirely (.no-anim). */
  @keyframes tileDescend{from{opacity:0;transform:translateY(-30px);}to{opacity:1;transform:translateY(0);}}
  @keyframes tileRise{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  #screen-home .grid .tile{opacity:0;}
  #screen-home .grid .tile.enter-down{animation:tileDescend .5s cubic-bezier(.2,.8,.2,1) forwards;}
  #screen-home .grid .tile.enter-up{animation:tileRise .5s cubic-bezier(.2,.8,.2,1) forwards;}
  #screen-home .grid .tile.no-anim{opacity:1;animation:none;transform:none;}
  @media (prefers-reduced-motion: reduce){
    #screen-home .grid .tile{opacity:1!important;animation:none!important;transform:none!important;}
  }
  .tile.outline-white{background:transparent;border-color:var(--white);}
  .tile.outline-green{background:transparent;border-color:var(--accent-green);color:var(--accent-green);}
  .tile.outline-pink{background:transparent;border-color:var(--accent-pink);color:var(--accent-pink);}
  .tile.outline-orange{background:transparent;border-color:var(--accent-orange);color:var(--accent-orange);}
  .tile.outline-purple{background:transparent;border-color:var(--accent-purple);}
  .tile svg{width:58px;height:58px;}
  .tile.icon-orange svg{stroke:var(--accent-orange);}
  .tile.icon-white svg{stroke:var(--white);}

  /* ---------- tattoo keypad ---------- */
  .preview-card{background:var(--card-dark);border-radius:var(--radius);padding:20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-family:'Courier New',monospace;font-size:20px;}
  .keypad-grid{background:var(--card);border-radius:var(--radius);padding:6px;margin-bottom:18px;}
  .keypad-grid .grid3{display:grid;grid-template-columns:repeat(3,1fr);}
  .keypad-grid .k{
    padding:20px 0;text-align:center;font-size:28px;font-weight:600;color:var(--white);
    border:none;background:transparent;cursor:pointer;position:relative;
  }
  .keypad-grid .k::after{content:"";position:absolute;right:0;top:15%;bottom:15%;width:1px;background:rgba(255,255,255,.15);}
  .keypad-grid .k:nth-child(3n)::after{display:none;}
  .keypad-grid .row-div{height:1px;background:rgba(255,255,255,.15);margin:0 8px;}
  .keypad-grid .k.enter{color:var(--accent-green);}

  /* ---------- caps ---------- */
  .toggle-row{display:flex;gap:10px;margin-bottom:12px;}
  .toggle-btn{flex:1;padding:20px 10px;border-radius:var(--radius);border:none;font-family:var(--font-ui);font-style:italic;font-weight:600;font-size:16px;cursor:pointer;background:var(--card-mid);color:#241f4d;}
  .toggle-btn.on{background:var(--accent-orange);color:#241f4d;}
  .text-input{width:100%;background:var(--card-dark);border:2px solid transparent;border-radius:var(--radius);padding:16px;color:var(--text-soft);font-family:var(--font-ui);font-style:italic;font-size:16px;text-align:center;margin-bottom:12px;outline:none;box-shadow:none;}
  .text-input:focus{border-color:var(--accent-orange);outline:none;box-shadow:none;}
  .text-input::placeholder{color:var(--text-soft);}
  .add-row{background:var(--card);border-radius:var(--radius);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border:none;color:var(--white);width:100%;font-size:16px;font-style:italic;font-weight:600;cursor:pointer;}

  /* ---------- orders ---------- */
  .order-row{background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;cursor:pointer;}
  .order-row .head{display:flex;justify-content:space-between;font-size:15px;}
  .order-row.expanded{background:var(--card-mid);}
  .order-row.expanded .head{color:var(--accent-orange);font-style:italic;}
  /* Same border/fill accent pattern as .cart-item / .pay-item-row — an expanded order should
     read as the same per-product colors as the register's Current Order list, one row per
     item instead of a flat text line. */
  .order-sub{
    display:flex;justify-content:space-between;font-size:14px;
    border-radius:var(--radius);min-height:44px;align-items:center;
    padding:0 16px;margin-top:8px;
    border:2px solid var(--item-accent, var(--white));
    background:transparent;color:var(--white);
  }
  #app.style-fill .order-sub{
    border-color:transparent;
    background:color-mix(in srgb, var(--item-accent, var(--white)) 45%, var(--card));
  }
  .search-input{width:100%;height:45px;background:var(--accent-lavender);border:none;border-radius:var(--radius);padding:0 22px;color:#241a3a;font-family:var(--font-ui);font-style:italic;font-size:15px;text-align:center;margin-bottom:14px;}
  .search-input::placeholder{color:#3d2f5c;}

  /* ---------- reports ---------- */
  .stat-hero{background:var(--card-dark);border-radius:var(--radius);padding:24px;text-align:center;margin-bottom:12px;}
  .stat-hero .num{font-size:40px;font-weight:500;color:var(--accent-green);}
  .stat-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px;}
  .stat-box{background:var(--card-dark);border-radius:var(--radius);padding:18px 8px;text-align:center;}
  .stat-box .num{font-size:24px;font-weight:700;color:var(--accent-green);}
  .stat-box .lbl{font-size:11px;letter-spacing:.06em;color:var(--text-faint);margin-top:4px;}
  .bar-row{margin-bottom:14px;}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;}
  .bar-track{height:12px;border-radius:var(--radius);background:var(--card-dark);overflow:hidden;}
  .bar-fill{height:100%;border-radius:var(--radius);}

  /* ---------- sale details ---------- */
  .sd-title{font-family:var(--font-title);font-size:24px;color:var(--white);margin:6px 0 22px;line-height:1.3;}
  .detail-row{min-height:52px;margin-bottom:8px;padding:0 18px;}
  .detail-row .lbl{font-style:italic;font-size:20px;}
  .detail-row .price{font-weight:400;font-size:20px;}
  .detail-row.total{min-height:64px;margin-top:18px;}
  .detail-row.total .lbl, .detail-row.total .price{font-style:normal;font-weight:700;font-size:22px;}

  /* ---------- admin ---------- */
  /* .screen has no background of its own (the .device frame's --bg shows through everywhere),
     but .screen{position:absolute;inset:0} means #screen-admin fully covers the frame when
     active, so giving it its own background here is enough to make Admin visually distinct
     without touching any other screen. */
  #screen-admin{background:var(--admin-bg);}
  /* Tab bar sits directly on the Admin background now (no pill behind it) -- active tab in the
     admin accent, everything else in white. */
  .tabbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0;margin-bottom:20px;font-family:var(--font-title);font-size:26px;color:var(--white);}
  .tabbar span{cursor:pointer;}
  .tabbar span.active{color:var(--admin-accent);}
  .tabbar .sep{cursor:default;color:var(--white);opacity:.4;font-family:var(--font-ui);font-weight:300;}
  /* Global tab: one row per kiosk/payment method, each its own card on --admin-card. Kiosk rows
     get a thin share-of-grand-total bar (see .pct-bar); Payment rows reuse the same row style
     without one; Total is the same row again, just bigger and in the admin accent. */
  .admin-row{background:var(--admin-card);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;}
  .admin-row .lbl{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-ui);font-style:italic;font-weight:500;font-size:24px;}
  .admin-row .pct-bar{height:2px;background:var(--admin-accent);border-radius:1px;margin-top:12px;}
  .admin-row.total{padding:22px 18px;margin-top:8px;}
  .admin-row.total .lbl{color:var(--admin-accent);font-size:26px;}
  .kiosk-status{background:var(--admin-card);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;border:2px solid transparent;cursor:pointer;}
  .kiosk-status.active{border-color:var(--admin-accent);}
  .kiosk-status .top{display:flex;justify-content:space-between;align-items:baseline;}
  .kiosk-status .name{font-weight:700;font-size:15px;}
  .kiosk-status .tag{color:var(--admin-accent);font-style:italic;font-size:13px;}
  .kiosk-status .sale{font-size:14px;color:var(--text-soft);font-style:italic;margin-top:4px;}
  .kiosk-status .status{font-style:italic;font-size:14px;color:var(--admin-accent);}
  .kiosk-status .status.off{color:var(--text-faint);}
  .copy-link-btn{
    margin-top:10px;width:100%;background:var(--card-mid);color:var(--admin-accent);
    border:none;border-radius:var(--radius);padding:10px;
    font-family:var(--font-ui);font-style:italic;font-weight:600;font-size:13px;cursor:pointer;
  }

  /* design tab */
  .swatch-row{display:flex;align-items:center;justify-content:space-between;background:var(--card-dark);border-radius:var(--radius);padding:14px 18px;margin-bottom:10px;}
  .swatch-row .lbl{font-size:14px;color:var(--text-soft);}
  .swatch-row input[type=color]{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:none;padding:0;cursor:pointer;}
  .seg{display:flex;background:var(--card-dark);border-radius:var(--radius);padding:4px;margin-bottom:18px;}
  /* Admin's own surfaces (Kiosks/Design/Settings rows, inputs, toggles) get the same dark card
     tone as Global's rows -- scoped to #screen-admin so Register/Orders/Reports, which share
     these same classes, are untouched. */
  #screen-admin .row-card, #screen-admin .swatch-row, #screen-admin .seg, #screen-admin .text-input{background:var(--admin-card);}
  #screen-admin .settings-slider{accent-color:var(--admin-accent);}
  .seg button{flex:1;border:none;background:transparent;color:var(--text-faint);padding:12px 0;border-radius:var(--radius);font-family:var(--font-ui);font-weight:600;cursor:pointer;}
  .seg button.on{background:var(--accent-purple);color:#221a3a;}
  .mini-preview{margin-bottom:8px;}

  /* payment / success */
  .method-row{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:10px;font-weight:600;cursor:pointer;border:2px solid transparent;}
  .method-row.sel{border-color:var(--accent-green);background:var(--card-mid);}
  .amount-due{text-align:center;margin:20px 0 26px;}
  .amount-due .lbl{color:var(--text-faint);font-size:14px;}
  .amount-due .num{font-size:44px;font-weight:800;font-family:'Courier New',monospace;}
  /* The ring and check mark are drawn with stroke-dasharray/dashoffset (dasharray set to each
     shape's own path length, dashoffset animated from that length down to 0) rather than the
     old plain CSS-border circle, so the ring can trace itself in before the check mark draws —
     replayed on every sale via playSuccessCheckAnimation()/.animate, not just once. */
  .check-circle{width:90px;height:90px;margin:24px auto 18px;}
  .check-circle svg{width:100%;height:100%;overflow:visible;}
  .check-circle-ring{stroke:var(--accent-green);fill:none;stroke-dasharray:264;stroke-dashoffset:264;}
  .check-circle-tick{stroke:var(--accent-green);fill:none;stroke-dasharray:60;stroke-dashoffset:60;}
  .check-circle.animate .check-circle-ring{animation:drawRing .5s ease-out forwards;}
  .check-circle.animate .check-circle-tick{animation:drawTick .35s ease-out .45s forwards;}
  @keyframes drawRing{to{stroke-dashoffset:0;}}
  @keyframes drawTick{to{stroke-dashoffset:0;}}
  @media (prefers-reduced-motion: reduce){
    .check-circle-ring, .check-circle-tick{animation:none!important;stroke-dashoffset:0!important;}
  }
  @keyframes cheerRise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .success-cheer{font-family:var(--font-title);font-size:28px;color:var(--white);margin:40px 0 0;opacity:0;}
  .success-cheer.animate{animation:cheerRise .45s ease-out .75s forwards;}
  @media (prefers-reduced-motion: reduce){
    .success-cheer{animation:none!important;opacity:1!important;transform:none!important;}
  }
  #screen-success{align-items:center;text-align:center;padding-left:16px;padding-right:16px;padding-top:156px;}
  .empty-hint{color:var(--text-faint);font-style:italic;text-align:center;margin-top:40px;font-size:14px;}
  .pill.newsale{background:var(--accent-green);color:var(--accent-blue);justify-content:center;height:70px;width:358px;max-width:100%;}

  /* ---------- modal (kiosk switch / logout / admin gate) ---------- */
  /* No border-radius here on purpose: .device already clips with overflow:hidden at whatever
     radius IT has (rounded in the app.html/Artifact phone-frame preview, square in the real
     index.html deployment) — inheriting that clip keeps this overlay always matching its own
     device instead of carrying a hardcoded radius that used to show as stray rounded corners
     on the real (square) kiosk screen. */
  .modal-overlay{position:absolute;inset:0;background:rgba(10,9,30,.6);display:none;align-items:center;justify-content:center;z-index:50;}
  .modal-overlay.active{display:flex;}
  .modal-box{background:var(--card-dark);border-radius:var(--radius);padding:28px;width:330px;max-width:90%;}
  .modal-title{font-family:var(--font-title);font-size:24px;margin:0 0 16px;text-align:center;color:var(--white);}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-btn{flex:1;border:none;border-radius:var(--radius);padding:14px 0;font-family:var(--font-ui);font-weight:600;cursor:pointer;font-size:14px;}
  .modal-btn.primary{background:var(--accent-orange);color:#241a08;}
  .modal-btn.ghost{background:var(--card);color:var(--white);}
  .kiosk-pick{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .kiosk-pick button{background:var(--card);border:2px solid transparent;border-radius:var(--radius);padding:14px;color:var(--white);font-family:var(--font-ui);font-weight:600;cursor:pointer;text-align:left;font-size:14px;}
  .kiosk-pick button.sel{border-color:var(--accent-orange);}
  .pin-modal-dots{display:flex;gap:18px;justify-content:center;margin:14px 0 20px;}
  .pin-modal-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--white);}
  .pin-modal-dot.filled{background:var(--white);}
  .modal-box .keypad-round{margin:0 auto;max-width:264px;gap:18px;}
  .modal-box .key-round{font-size:24px;}
  .modal-err{color:var(--accent-pink);font-size:12px;text-align:center;margin:-8px 0 10px;min-height:14px;}

  .settings-slider{width:100%;accent-color:var(--accent-orange);height:6px;}

  .updating-badge{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:60;
    background:var(--card-dark);color:var(--text-soft);font-family:var(--font-ui);font-style:italic;font-size:12px;
    padding:6px 16px;border-radius:var(--radius);white-space:nowrap;
  }
</style>

<script>
/* ================= BACKEND CONFIG =================
   Wired to the real Siluetas Art Studio Apps Script Web App — same endpoint
   contract as the live app at siluetas-art-studio.github.io/SALE_APP:
     ?number=<n>                 -> {found, price, name}                 (tattoo lookup)
     ?staffCode=<code>           -> {found, active, name, shop}          (staff login)
     ?lookup=all                 -> {tattoos,braids,staff,kiosks,capPrices,capNames,others}
     ?lookup=cap&name=<sheetName>-> {found, price}                       (cap price lookup)
     ?lookup=dailyTotals         -> {grandTotal, count, categoryTotals, methodTotals, kioskTotals}
     ?lookup=todayOrders         -> {orders:[{rowId, kiosk, time, method, items, total}]}
     ?action=logSale&kiosk=&staff=&items=&category=&method=&total=  (fire-and-forget write) */
const CONFIG = {
  SHEET_URL: 'https://script.google.com/macros/s/AKfycbzGmke5XQi0EG_t07fpxmUL2rSGe3kkbXmGljqLVzfXI0OoAMpiAIB_iMokqq7Ijlx2/exec',
  adminPin: '9999',
  idleTimeoutSeconds: 45,
  sampleTattooPrice: 20,
};
// Staff code that marks a login as an admin session (the "RUIZ_AD" row in the Staff sheet, one
// per shop) -- signing in with it skips the separate Admin PIN prompt, since typing this code was
// already the admin-level credential. Compared against the code the person types, same as any
// other staff code.
const ADMIN_STAFF_CODE = '909';
/* Staff cheer message on the Sale Complete screen — picks the tier whose threshold is the
   highest one at-or-below the sale total, so there's always a match with no gaps. "{name}" is
   replaced with the staff member's first name. Editable from Admin > Settings. */
const SALE_MESSAGE_DEFAULTS = [
  { threshold:0,  text:'Good job {name}!' },
  { threshold:40, text:'Very nice {name}!' },
  { threshold:50, text:'OMGGG {name}!' },
  { threshold:60, text:'You are the best {name}!' },
];
const CACHE_KEY = 'kioskpos_cache_v1';
const DAILY_CACHE_KEY = 'kioskpos_daily_v1';
const ORDERS_CACHE_KEY = 'kioskpos_orders_v1';
const SALE_MSG_KEY = 'kioskpos_sale_messages_v1';
const HOME_ANIM_KEY = 'kioskpos_home_anim_v1';
const ADMIN_PIN_KEY = 'kioskpos_admin_pin_v1'; // client-side override only — the live backend has no settings-write endpoint
const ACTIVE_KIOSK_KEY = 'kioskpos_active_kiosk_v1'; // persists which kiosk THIS device is, set only via Admin
const DESIGN_KEY = 'kioskpos_design_v1'; // persists Admin > Design tab: item style (border/fill) + custom color vars

/* Every GET to the sheet is read-freshness-sensitive (staff editing rows, then expecting the
   kiosk to reflect it), but a plain fetch() to the exact same Apps Script URL is exactly the
   shape browsers (and sometimes an intermediate proxy) cache — so a deleted/edited sheet row
   can silently keep showing the old response. bustUrl() appends a one-time timestamp so the
   URL is never identical twice, and {cache:'no-store'} tells the browser not to use its own
   HTTP cache for the request even if the server response doesn't set no-cache headers itself
   (Apps Script Web Apps don't reliably control their own caching headers). */
function bustUrl(url){ return url + (url.includes('?') ? '&' : '?') + '_ts=' + Date.now(); }
function fetchWithTimeout(url, ms){
  // Plain Promise.race rather than an AbortController signal — some embedded preview/devtools
  // contexts try to relay fetch() calls across a postMessage boundary for logging, and an
  // AbortSignal can't be structured-cloned, which throws before the request even goes out.
  // This loses true request cancellation on timeout but keeps the call itself bulletproof.
  const timeout = new Promise((_, reject)=> setTimeout(()=>reject(new Error('timeout')), ms||8000));
  return Promise.race([fetch(bustUrl(url), {cache:'no-store'}), timeout]);
}

/* ================= DATA =================
   Live catalog/pricing/staff/kiosk data is fetched from CONFIG.SHEET_URL (see sheet{} below)
   and cached in localStorage. The tables here are FALLBACK data only, used if the sheet is
   unreachable and nothing is cached yet — same role as the TATTOOS/BRAIDS arrays in the
   original app. */
const CATALOG = {
  tattoos: { label:'Tattoos', accentVar:'--accent-green', type:'keypad',
    fallback:{
      '54':{name:'Lion',price:12}, '65':{name:'Chinese letter',price:12}, '12':{name:'Skull',price:14}, '42':{name:'Rose',price:12},
      '10':{name:'Anchor',price:10}, '11':{name:'Butterfly',price:12}, '15':{name:'Heart',price:10}, '20':{name:'Star',price:8},
      '25':{name:'Dragon',price:16}, '30':{name:'Wolf',price:14}, '33':{name:'Feather',price:10}, '40':{name:'Tribal band',price:12},
      '45':{name:'Cross',price:8}, '50':{name:'Snake',price:14}, '60':{name:'Flower',price:10}, '70':{name:'Compass',price:12},
      '75':{name:'Phoenix',price:16}, '80':{name:'Infinity',price:8}, '85':{name:'Om symbol',price:10}, '90':{name:'Arrow',price:8},
      '95':{name:'Small script',price:10}, '99':{name:'Custom design',price:20},
    } },
  braids: { label:'Braids', accentVar:'--accent-pink', type:'list',
    fallbackItems:[
      {name:'1 Summer Braid',price:14},
      {name:'2 Summer Braids',price:28},
      {name:'3 Summer Braids',price:30},
    ],
    // Last-resort offline default for the Téréré sub-menu (sheet columns J/K) — kept in sync
    // with the real sheet values so a no-network/no-cache view still shows the right 3 sizes
    // instead of a single made-up price.
    terereFallback:[
      {name:'Téréré M', price:14},
      {name:'Téréré L', price:16},
      {name:'Téréré XL', price:18},
    ] },
  caps: { label:'Caps', accentVar:'--accent-orange', type:'caps', fallbackPrices:{custom:18, regular:18}, fallbackNames:{custom:'Custom cap', regular:'Regular cap'} },
  others: { label:'Others', accentVar:'--white', type:'list',
    fallbackItems:[ {name:'T-Shirt',price:15}, {name:'Keychain',price:6} ] },
};
const KIOSK_FALLBACK = ['ALFA1','ALFA2','CHARLIE','DELTA'];
// The 4 real physical kiosks -- also the allowlist for Admin > Global's aggregates (grand total,
// cash/other split, per-kiosk bars). A sheet can list OTHER kiosk-like entries too (e.g. a
// temporary "TEST KIOSK" tab used for testing without touching real numbers) -- those still show
// up normally in Admin > Kiosks so they can be selected and used, they're just excluded from
// Global's totals so test sales never get counted as real ones. Reuses KIOSK_FALLBACK itself
// rather than a second list, so a real kiosk only ever needs to be added in one place.
function isRealKiosk(name){ return KIOSK_FALLBACK.includes(String(name||'').toUpperCase()); }
const PAY_METHODS = ['Cash','Card / phone card','Revolut','MB WAY','Other'];

/* ================= LIVE SHEET DATA (populated from cache, refreshed from network) ================= */
const sheet = {
  tattoos:null, braids:null, others:null, terere:null, capPrices:null, capNames:null, staff:null, kiosks:null,
  cacheUpdatedAt:null, dailyTotals:null, ordersToday:null,
};
/* The sheet has a dedicated Terere column (M/L/XL, sheet columns J/price K) separate from the
   Braid column — the Apps Script's ?lookup=all response should expose that as its own field.
   The exact key name coming back from the real backend isn't confirmed, so this first checks a
   few likely spellings, then — since guessing the key wrong was silently dropping the real
   M/L/XL rows and falling back to a single hardcoded "Téréré $16" placeholder — falls back to
   scanning EVERY array in the response for name/price rows that look like Terere items,
   regardless of which key they're filed under. That way this keeps working even if the backend
   uses a field name none of the guesses below cover. */
function extractTerereList(data){
  const candidates = [data.terere, data.tereres, data.tereré, data.Terere, data.terereList, data.tereréList];
  for(const c of candidates){ if(Array.isArray(c) && c.length) return c; }
  for(const key of Object.keys(data||{})){
    const val = data[key];
    if(Array.isArray(val) && val.length && val.every(it=>it && typeof it==='object' && 'name' in it)){
      const matches = val.filter(it=>isTerereItem(it.name));
      if(matches.length) return matches;
    }
  }
  return [];
}
function isTerereItem(name){
  const norm = String(name).toLowerCase().replace(/[éèêë]/g, 'e');
  return norm.indexOf('terere') === 0;
}
/* Kiosk identifiers come back from the sheet as e.g. "ALFA1" (no space) — that's the canonical
   value used for API matching (staffShop, dailyTotals.kioskTotals keys). These just format that
   canonical value for display, matching the reference design ("Alfa 1" / "ALFA 1"). */
function formatKioskName(raw){
  if(!raw) return raw;
  const m = String(raw).match(/^([A-Za-z]+)(\d+)$/);
  if(m) return m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase()+' '+m[2];
  return raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase();
}
function formatKioskCaps(raw){
  const m = String(raw).match(/^([A-Za-z]+)(\d+)$/);
  return m ? (m[1].toUpperCase()+' '+m[2]) : String(raw).toUpperCase();
}
function getAdminPin(){ try{ return localStorage.getItem(ADMIN_PIN_KEY) || CONFIG.adminPin; }catch(e){ return CONFIG.adminPin; } }
function setAdminPin(v){ try{ localStorage.setItem(ADMIN_PIN_KEY, v); }catch(e){} }

const ORDERS = []; // local-session fallback orders (only used until the sheet's todayOrders arrive)

/* ================= STATE ================= */
const state = {
  screen:'login',
  pin:'',
  pinLen:3,
  loginError:'',
  loginBusy:false,
  currentKiosk:'ALFA1',
  staffName:'',
  isAdminStaff:false, // true when the signed-in staff code is ADMIN_STAFF_CODE -- skips the Admin PIN gate
  register:{ category:'tattoos', expanded:true, subExpanded:false, keypad:'', preview:null, previewLoading:false, tattooLoading:false, capMode:'custom', capName:'', capPrice:18, capPriceLoading:false, cart:[] },
  orders:{ view:'list', hourFilter:'', expandedId:null },
  admin:{ tab:'global', selectedKiosk:0, saleMsgOpen:false, copiedKiosk:null },
  itemStyle:'fill', // default for any device with no saved Design tab choice yet -- see loadDesign()
  settings:{
    requireLogin:true,
    showUpdatingIndicator:true,
    lastSynced:null,
    adminCodeDraft:'',
    idleTimeoutSec:CONFIG.idleTimeoutSeconds,
    refreshBusy:false,
    refreshMsg:'',
    saleMessages: SALE_MESSAGE_DEFAULTS.map(m=>({...m})),
    homeAnimEnabled:true,
  },
};

/* ================= NAV ================= */
function goto(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const map = { home:'screen-home', register:'screen-register', orders:'screen-orders', reports:'screen-reports', saledetail:'screen-saledetail', admin:'screen-admin', kiosks:'screen-admin', payment:'screen-payment', success:'screen-success', login:'screen-login' };
  document.getElementById(map[name]).classList.add('active');
  state.screen = name;
  if(name==='home') playHomeEntrance();
  if(name==='register') renderRegister();
  if(name==='orders'){ renderOrders(); refreshDailyTotals(true); }
  if(name==='reports'){ renderReports(); refreshDailyTotals(true); }
  if(name==='saledetail'){ renderSaleDetail(); refreshDailyTotals(true); }
  if(name==='admin'||name==='kiosks'){
    if(name==='kiosks') state.admin.tab='kiosks';
    renderAdmin();
    // Global shows live per-kiosk totals/category/payment mix, same as Orders/Reports above --
    // needs the same refresh-on-entry treatment, since otherwise it only ever shows whatever
    // was already cached from the last time Orders/Reports/a sale happened to fetch.
    if(state.admin.tab==='global') refreshDailyTotals(true);
  }
  if(name==='payment') renderPayment();
  renderChargeBar();
  document.getElementById('confirmPayBtn').classList.toggle('hidden', name!=='payment');
  resetIdleTimer();
}
/* Replays the Home screen's tile entrance animation (see the tileDescend/tileRise keyframes)
   every time Home becomes active, not just on first page load — remove the animation classes,
   force a reflow so the browser forgets it already ran, then re-add them. Skips straight to
   the settled state (no-anim) when turned off in Admin > Settings. */
function playHomeEntrance(){
  const tiles = document.querySelectorAll('#screen-home .grid .tile');
  if(!tiles.length) return;
  const enabled = state.settings.homeAnimEnabled;
  tiles.forEach(el=>{ el.classList.remove('enter-down','enter-up','no-anim'); });
  void document.getElementById('screen-home').offsetWidth;
  tiles.forEach((el,i)=>{ el.classList.add(enabled ? (i<4 ? 'enter-down' : 'enter-up') : 'no-anim'); });
}
function renderChargeBar(){
  const total = state.register.cart.reduce((s,i)=>s+i.price,0);
  const count = state.register.cart.length;
  document.getElementById('gcbCount').textContent = count + ' Charge order';
  document.getElementById('gcbTotal').textContent = fmt(total);
  const bar = document.getElementById('globalChargeBar');
  const hideOn = ['login','payment','success'];
  bar.classList.toggle('hidden', hideOn.includes(state.screen) || count===0);
}
function openRegister(cat){
  state.register.category = cat;
  state.register.expanded = true;
  state.register.subExpanded = false;
  state.register.keypad = '';

/* ================= WHO / KIOSK / LOGOUT ================= */
function renderWho(){
  document.querySelectorAll('.who .kiosk').forEach(el=>{ el.textContent = formatKioskName(state.currentKiosk); });
  document.querySelectorAll('.who .staff').forEach(el=>{ if(el.textContent!=='Ruiz') el.textContent = state.staffName; });
}
function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('modalOverlay').classList.add('active'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('active'); }
function closeModalBg(e){ if(e.target.id==='modalOverlay') closeModal(); }

function kioskNames(){ return (sheet.kiosks && sheet.kiosks.length) ? sheet.kiosks : KIOSK_FALLBACK; }
/* Opaque per-kiosk tokens for the "?k=TOKEN" setup-link feature (see applyKioskFromLink and
   copyKioskLink below). Deliberately NOT the plain kiosk name — a link like "?kiosk=ALFA2"
   invites a curious staff member to just edit it to "?kiosk=CHARLIE" and switch kiosks
   themselves, which defeats the whole point. A random-looking token isn't guessable or
   suggestive. Worth being upfront about the limit though: this is a public static site with
   visible source, so it's not a real security boundary against someone who goes looking at the
   page's own JavaScript — it only stops casual/accidental tampering, which is the actual
   scenario this exists to prevent. Generate new tokens (any random string) if these are ever
   shared somewhere they shouldn't be. */
const KIOSK_LINK_TOKENS = {
  'a7k2': 'ALFA1',
  'b4p8': 'ALFA2',
  'c9w3': 'CHARLIE',
  'd2y5': 'DELTA',
};
function kioskLinkToken(name){
  return Object.keys(KIOSK_LINK_TOKENS).find(t=>KIOSK_LINK_TOKENS[t]===name) || null;
}
/* Lets a device be pinned to a specific kiosk just by opening a dedicated link —
   .../index.html?k=b4p8 — instead of needing physical access to tap through Admin > Kiosks
   on that device. Called once on load (see init()), after loadCaches() so a valid link always
   wins over whatever kiosk was previously cached on this device. The assignment is persisted to
   localStorage immediately, so it survives "Add to Home Screen": the installed icon reads the
   same localStorage even if it later launches via the manifest's plain start_url rather than
   this exact link. An unrecognized or missing ?k= is silently ignored — never breaks the app,
   just leaves the existing/default kiosk in place. */
function applyKioskFromLink(){
  try{
    const q = new URLSearchParams(location.search).get('k');
    if(!q) return;
    const match = KIOSK_LINK_TOKENS[q];
    if(!match || !kioskNames().includes(match)) return;
    state.currentKiosk = match;
    localStorage.setItem(ACTIVE_KIOSK_KEY, match);
  }catch(e){}
}
/* Copies a ready-to-send setup link for one kiosk to the clipboard, from Admin > Kiosks — so
   sending a staff member the right kiosk never means typing/remembering a URL by hand. */
function copyKioskLink(name){
  const token = kioskLinkToken(name);
  if(!token) return;
  const url = location.origin + location.pathname + '?k=' + token;
  const showCopied = ()=>{
    state.admin.copiedKiosk = name;
    renderAdmin();
    setTimeout(()=>{ if(state.admin.copiedKiosk===name){ state.admin.copiedKiosk=null; renderAdmin(); } }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(showCopied).catch(showCopied);
  } else {
    showCopied();
  }
}
function openKioskSwitch(){
  const html = `<div class="modal-title">Switch kiosk</div>
    <div class="kiosk-pick">${kioskNames().map(n=>`<button class="${n===state.currentKiosk?'sel':''}" onclick="selectKiosk('${n}')">${formatKioskName(n)}</button>`).join('')}</div>
    <button class="modal-btn ghost" style="width:100%;margin-top:10px;" onclick="closeModal()">Cancel</button>`;
  openModal(html);
}
function selectKiosk(n){
  state.currentKiosk = n;
  try{ localStorage.setItem(ACTIVE_KIOSK_KEY, n); }catch(e){}
  closeModal(); renderWho(); renderAdmin();
}

function openLogout(){
  const html = `<div class="modal-title">Log out?</div>
    <p style="text-align:center;color:var(--text-soft);font-size:14px;margin:0 0 4px;">${state.staffName} will be signed out of ${formatKioskName(state.currentKiosk)}.</p>
    <div class="modal-actions">
      <button class="modal-btn ghost" onclick="closeModal()">Cancel</button>

    </div>`;

}

  closeModal();

}

/* admin PIN gate */
let adminPinBuf = '';
let adminGateTarget = 'global';
function openAdminGate(targetTab){
  // Signed in with the admin staff code (ADMIN_STAFF_CODE) -- that login already IS the admin
  // credential, so skip re-asking for the separate 4-digit Admin PIN.
  if(state.isAdminStaff){
    state.admin.tab = targetTab || 'global';
    goto('admin');
    return;
  }
  adminGateTarget = targetTab || 'global';
  adminPinBuf = '';
  renderAdminGate('');
  document.getElementById('modalOverlay').classList.add('active');
}
function renderAdminGate(err){
  const dots = Array.from({length:4},(_,i)=>`<div class="pin-modal-dot${i<adminPinBuf.length?' filled':''}"></div>`).join('');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','back'];
  const html = `<div class="modal-title">Admin code</div>
    <div class="pin-modal-dots">${dots}</div>
    <div class="modal-err">${err||''}</div>
    <div class="keypad-round">
      ${keys.map(k=> k==='' ? '<button class="key-round ghost"></button>' : `<button class="key-round" onclick="adminPinPress('${k}')">${k==='back'?'x':k}</button>`).join('')}
    </div>
    <button class="modal-btn ghost" style="width:100%;margin-top:14px;" onclick="closeModal()">Cancel</button>`;
  document.getElementById('modalBox').innerHTML = html;
}
function adminPinPress(k){
  if(k==='back'){ adminPinBuf = adminPinBuf.slice(0,-1); renderAdminGate(''); return; }
  if(adminPinBuf.length>=4) return;
  adminPinBuf += k;
  renderAdminGate('');
  if(adminPinBuf.length===4){
    const buf = adminPinBuf;
    setTimeout(()=>{
      if(buf===getAdminPin()){ closeModal(); state.admin.tab = adminGateTarget; goto('admin'); }
      else { adminPinBuf=''; renderAdminGate('Wrong code, try again'); }
    }, 200);
  }
}

/* ================= LOGIN ================= */
function renderPinDots(){
  const wrap = document.getElementById('pinDots');
  wrap.innerHTML='';
  for(let i=0;i<state.pinLen;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < state.pin.length ? ' filled':'');
    d.innerHTML = i < state.pin.length ? '<span class="star">*</span>' : '';
    wrap.appendChild(d);
  }
}
function setLoginHint(msg){
  const el = document.getElementById('loginHint');
  if(el) el.textContent = msg;
}
function pinPress(digit){
  if(state.loginBusy) return;
  if(state.pin.length >= state.pinLen) return;
  state.pin += digit;
  setLoginHint('type your code');
  renderPinDots();
  if(state.pin.length === state.pinLen) staffLogin();
}
function pinBack(){ if(state.loginBusy) return; state.pin = state.pin.slice(0,-1); renderPinDots(); }

/* Demo-mode login (preview builds only) ---------------------------------------
   Real kiosks (GitHub Pages) always reach the real staff sheet, so this never shows
   there. It exists purely so the app can be click-tested on hosts that can't reach
   the Google Sheet at all — e.g. a published Cowork Artifact, whose platform CSP
   blocks every outbound fetch. Gated on BOTH: (a) not a known production host, and
   (b) no real staff data cached yet. If you add a custom domain for the real
   deployment, add it to PRODUCTION_HOSTS below so this stays hidden there too. */
const PRODUCTION_HOSTS_SUFFIXES = ['.github.io'];
function isPreviewHost(){
  const h = location.hostname || '';
  return !PRODUCTION_HOSTS_SUFFIXES.some(suffix => h.endsWith(suffix));
}
function updateDemoLoginVisibility(){
  const btn = document.getElementById('demoLoginBtn');
  if(!btn) return;
  const hasRealStaffCache = !!(sheet.staff && sheet.staff.length);
  btn.style.display = (isPreviewHost() && !hasRealStaffCache) ? 'block' : 'none';
}
function demoLogin(){
  completeLogin('Demo Staff', state.currentKiosk);
}
function staffLogin(){
  const code = state.pin;
  const cached = (sheet.staff||[]).find(s=>String(s.code).toUpperCase()===code.toUpperCase());
  if(cached){
    if(String(cached.active).toUpperCase()==='Y'){ completeLogin(cached.name, cached.shop, code.toUpperCase()===ADMIN_STAFF_CODE); }
    else { state.pin=''; renderPinDots(); setLoginHint('Code not found or inactive'); }
    return;
  }
  state.loginBusy = true;
  setLoginHint('Checking…');
  fetch(bustUrl(CONFIG.SHEET_URL + '?staffCode=' + encodeURIComponent(code)), {cache:'no-store'}).then(r=>r.json()).then(data=>{
    state.loginBusy = false;
    if(data.found && String(data.active).toUpperCase()==='Y'){ completeLogin(data.name, data.shop, code.toUpperCase()===ADMIN_STAFF_CODE); }
    else { state.pin=''; renderPinDots(); setLoginHint('Code not found or inactive'); }
  }).catch(err=>{
    console.error('Staff lookup failed:', err);
    state.loginBusy = false;
    state.pin=''; renderPinDots();
    setLoginHint('Connection error — try again');
    updateDemoLoginVisibility();
  });
}
function completeLogin(name, shop, isAdmin){
  // Deliberately does NOT touch state.currentKiosk. The active kiosk is a property of this
  // physical device, set once via Admin — not of whichever staff member is currently signed
  // in. A staff code can match rows for multiple shops in the sheet (the same person working
  // at more than one kiosk), so the `shop` the login lookup happens to return is not reliable
  // signal for "which kiosk is this device."
  state.staffName = name;
  state.isAdminStaff = !!isAdmin;
  state.pin=''; renderPinDots(); setLoginHint('type your code');
  goto('home'); renderWho();
}
renderPinDots();

/* ================= REGISTER ================= */
// Every product price is a whole dollar amount, so any correctly-computed total should already
// be a whole number — this round() is a safety net against stray floating-point noise, not a
// substitute for computing exact totals upstream.
function fmt(n){ return '$'+Math.round(Number(n)||0); }
function fmt1(n){ return '$'+(Math.round(n*10)/10).toFixed(1); }

function renderRegister(){
  const r = state.register;
  const cat = CATALOG[r.category];
  const accent = `var(${cat.accentVar})`;
  const pillClass = cat.accentVar==='--accent-pink' ? 'accent-pink' : cat.accentVar==='--accent-orange' ? 'accent-orange' : cat.accentVar==='--accent-green' ? '' : '';
  let html = '';

  html += `<button class="pill ${pillClass}" style="${cat.accentVar==='--accent-green' ? 'background:var(--accent-green);color:#0d3324;':''}${cat.accentVar==='--white' ? '' : ''}" onclick="toggleExpand()">${cat.label} <span class="arrow">${r.expanded?'▼':'▶'}</span></button>`;

  if(r.expanded){
    if(cat.type==='keypad'){
      const p = r.preview;
      const notFoundText = isPreviewHost() ? `Sample &nbsp; ${fmt(CONFIG.sampleTattooPrice)}` : 'not found';
      const previewText = r.previewLoading ? 'checking…' : (p ? (p.found ? `${p.name} &nbsp; ${fmt(p.price)}` : notFoundText) : '');
      html += `<div class="preview-card"><span>${r.keypad || '····'}</span><span>${previewText}</span></div>`;
      html += `<div class="keypad-grid"><div class="grid3">`;
      const keys = ['1','2','3','4','5','6','7','8','9','x','0','Ent'];
      keys.forEach(k=>{
        const cls = k==='Ent' ? 'k enter' : 'k';
        const busy = k==='Ent' && r.tattooLoading;
        html += `<button class="${cls}" onclick="keypadPress('${k}')">${busy ? '…' : k}</button>`;
      });
      html += `</div></div>`;
    } else if(cat.type==='list'){
      const rawItems = (r.category==='braids')
        ? ((sheet.braids && sheet.braids.length) ? sheet.braids : CATALOG.braids.fallbackItems)
        : ((sheet.others && sheet.others.length) ? sheet.others : CATALOG.others.fallbackItems);
      // Terere (M/L/XL) has its own sheet column now — sourced from sheet.terere below. This
      // filter is just a safety net in case any Terere-named row still shows up mixed into the
      // braids list (e.g. from an older backend shape); isTerereItem() matches regardless of
      // accent/casing ("Téréré", "terere", "TERERE M", ...).
      const items = r.category==='braids' ? rawItems.filter(it=>!isTerereItem(it.name)) : rawItems;
      if(items.length){
        items.forEach(it=>{
          const price = Number(it.price);
          // A row with no price set in the sheet (e.g. "DIVERSO" in Others) is a price-on-demand
          // item -- tapping it asks the staff to type the amount for that particular sale instead
          // of silently adding a $0 line.
          if(price > 0){
            html += `<button class="row-card" onclick="addToCart('${it.name}',${price},'${cat.accentVar}')"><span>${it.name}</span><span class="price">${fmt(price)}</span></button>`;
          } else {
            html += `<button class="row-card" onclick="promptCustomPrice('${it.name}','${cat.accentVar}')"><span>${it.name}</span><span class="price">Enter amount</span></button>`;
          }
        });
      } else {
        html += `<p class="empty-hint">No "${cat.label}" products loaded from the sheet yet.</p>`;
      }
    } else if(cat.type==='caps'){
      html += `<div class="toggle-row">
        <button class="toggle-btn ${r.capMode==='custom'?'on':''}" onclick="setCapMode('custom')">Custom cap</button>
        <button class="toggle-btn ${r.capMode==='regular'?'on':''}" onclick="setCapMode('regular')">Regular cap</button>
      </div>`;
      if(r.capMode==='custom'){
        html += `<input class="text-input" placeholder="Type a name" value="${r.capName}" oninput="setCapName(this.value)">`;
      }
      const names = sheet.capNames || CATALOG.caps.fallbackNames;
      const label = r.capMode==='custom' ? ('+ Add ' + names.custom) : ('+ Add ' + names.regular);
      const priceText = r.capPriceLoading ? 'checking…' : fmt(r.capPrice);
      html += `<button class="add-row" onclick="addCap()"><span>${label}</span><span>${priceText}</span></button>`;
    }
  }

  if(r.category==='braids'){
    // Prefer the sheet's dedicated Terere column; fall back to picking Terere-named rows out
    // of the braids list (older backend shape), then a hardcoded default as a last resort.
    let tereList = (sheet.terere && sheet.terere.length) ? sheet.terere : null;
    if(!tereList){
      const braidSource = (sheet.braids && sheet.braids.length) ? sheet.braids : CATALOG.braids.fallbackItems;
      const tereItems = braidSource.filter(it=>isTerereItem(it.name));
      tereList = tereItems.length ? tereItems : CATALOG.braids.terereFallback;
    }
    html += `<button class="pill accent-purple" onclick="toggleSubExpand()">Téréré <span class="arrow">${r.subExpanded?'▼':'▶'}</span></button>`;
    if(r.subExpanded){
      tereList.forEach(tere=>{
        const terePrice = Number(tere.price);
        if(terePrice > 0){
          html += `<button class="row-card" onclick="addToCart('${tere.name}',${terePrice},'--accent-purple')"><span>${tere.name}</span><span class="price">${fmt(terePrice)}</span></button>`;
        } else {
          html += `<button class="row-card" onclick="promptCustomPrice('${tere.name}','--accent-purple')"><span>${tere.name}</span><span class="price">Enter amount</span></button>`;
        }
      });
    }
  }

  if(r.cart.length){
    html += `<div class="section-label">Current Order</div>`;
    r.cart.forEach((it,idx)=>{
      html += `<div class="cart-item" style="--item-accent:var(${it.accentVar});" onclick="confirmRemoveFromCart(${idx})"><span>${it.name}</span><span class="price">${fmt(it.price)}</span></div>`;
    });
  } else {
    html += `<p class="empty-hint">Tap an item to add it to the order</p>`;
  }

  document.getElementById('registerBody').innerHTML = html;
  renderChargeBar();
  resetIdleTimer();
}

function toggleExpand(){ state.register.expanded = !state.register.expanded; renderRegister(); }
function toggleSubExpand(){ state.register.subExpanded = !state.register.subExpanded; renderRegister(); }

/* Tattoo lookup: cache-first (sheet.tattoos), else debounced live lookup against the sheet,
   else the hardcoded fallback table — same 3-tier strategy as the live app. */
let _previewTimer = null;
function schedulePreviewLookup(){ clearTimeout(_previewTimer); _previewTimer = setTimeout(lookupPreview, 300); }
function lookupPreview(){
  const r = state.register;
  const raw = r.keypad;
  if(!raw) return;
  const n = parseInt(raw,10);
  const cached = (sheet.tattoos||[]).find(t=>Number(t.number)===n);
  if(cached){ r.preview = {found:true, name:cached.name, price:Number(cached.price)}; r.previewLoading=false; renderRegister(); return; }
  r.previewLoading = true;
  renderRegister();
  fetch(bustUrl(CONFIG.SHEET_URL + '?number=' + n), {cache:'no-store'}).then(res=>res.json()).then(data=>{
    if(state.register.keypad !== raw) return; // stale response, input changed since
    state.register.previewLoading = false;
    state.register.preview = data.found ? {found:true, name:data.name, price:Number(data.price)} : {found:false};
    renderRegister();
  }).catch(err=>{
    console.error('Tattoo lookup failed:', err);
    if(state.register.keypad !== raw) return;
    state.register.previewLoading = false;
    const fb = CATALOG.tattoos.fallback[raw];
    state.register.preview = fb ? {found:true, name:fb.name, price:fb.price} : {found:false};
    renderRegister();
  });
}
function keypadPress(k){
  const r = state.register;
  if(k==='x'){ r.keypad = r.keypad.slice(0,-1); r.preview=null; renderRegister(); if(r.keypad) schedulePreviewLookup(); return; }
  if(k==='Ent'){ tattooEnter(); return; }
  if(r.keypad.length >= 4) return;
  r.keypad += k;
  const n = parseInt(r.keypad,10);
  const cached = (sheet.tattoos||[]).find(t=>Number(t.number)===n);
  r.preview = cached ? {found:true, name:cached.name, price:Number(cached.price)} : null;
  renderRegister();
  schedulePreviewLookup();
}
/* PREVIEW-ONLY (see isPreviewHost()): a number not in the catalog still gets added, as a
   flat-priced "Sample" entry, instead of being blocked with "not found". This is purely so the
   design/flow can be click-tested here without needing real catalog numbers — it must NOT reach
   the real kiosks, where an unrecognized number should keep blocking the sale (staff should only
   ever charge for tattoos actually in the sheet). isPreviewHost() already keeps this off any
   `.github.io` production host; if a custom domain gets added for the real deployment, add it to
   PRODUCTION_HOSTS_SUFFIXES too. */
function addSampleTattoo(raw){
  addToCart(`#${raw} | Sample`, CONFIG.sampleTattooPrice, CATALOG.tattoos.accentVar);
  state.register.keypad=''; state.register.preview=null;
}
function tattooEnter(){
  const r = state.register;
  if(r.tattooLoading) return;
  const raw = r.keypad;
  if(!raw) return;
  const n = parseInt(raw,10);
  const cached = (sheet.tattoos||[]).find(t=>Number(t.number)===n);
  if(cached){ addToCart(`#${raw} | ${cached.name}`, Number(cached.price), CATALOG.tattoos.accentVar); r.keypad=''; r.preview=null; return; }
  r.tattooLoading = true;
  renderRegister();
  fetch(bustUrl(CONFIG.SHEET_URL + '?number=' + n), {cache:'no-store'}).then(res=>res.json()).then(data=>{
    r.tattooLoading = false;
    if(data.found){ addToCart(`#${raw} | ${data.name}`, Number(data.price), CATALOG.tattoos.accentVar); r.keypad=''; r.preview=null; }
    else if(isPreviewHost()){ addSampleTattoo(raw); }
    else { r.preview = {found:false}; renderRegister(); }
  }).catch(err=>{
    console.error('Tattoo enter failed, using fallback:', err);
    r.tattooLoading = false;
    const fb = CATALOG.tattoos.fallback[raw];
    if(fb){ addToCart(`#${raw} | ${fb.name}`, fb.price, CATALOG.tattoos.accentVar); r.keypad=''; r.preview=null; }
    else if(isPreviewHost()){ addSampleTattoo(raw); }
    else { r.preview = {found:false}; renderRegister(); }
  });
}

function addToCart(name, price, accentVar, category){
  state.register.cart.push({name, price, accentVar, category: category || state.register.category});
  renderRegister();
}
/* Price-on-demand items (a sheet row with no price, like "DIVERSO" in Others) open this instead
   of adding straight to the cart -- staff types the amount for that specific sale. Whole dollars
   only, same as every other price in the app (see fmt()'s rounding comment). */
function promptCustomPrice(name, accentVar){
  const html = `<div class="modal-title">Enter amount</div>
    <p style="text-align:center;color:var(--text-soft);font-size:14px;margin:0 0 4px;">${name}</p>
    <input class="text-input" id="customPriceInput" placeholder="$0" inputmode="numeric" maxlength="4">
    <div class="modal-err" id="customPriceErr"></div>
    <div class="modal-actions">
      <button class="modal-btn ghost" onclick="closeModal()">Cancel</button>
      <button class="modal-btn primary" onclick="confirmCustomPrice('${name}','${accentVar}')">Add</button>
    </div>`;
  openModal(html);
  setTimeout(()=>{ const el = document.getElementById('customPriceInput'); if(el) el.focus(); }, 50);
}
function confirmCustomPrice(name, accentVar){
  const input = document.getElementById('customPriceInput');
  const amount = Math.round(Number(input && input.value));
  if(!input || !input.value || !isFinite(amount) || amount <= 0){
    const errEl = document.getElementById('customPriceErr');
    if(errEl) errEl.textContent = 'Enter a valid amount';
    return;
  }
  addToCart(name, amount, accentVar);
  closeModal();
}
/* Tapping a cart item no longer removes it immediately — it opens a Yes/No confirmation
   naming the exact item, so a stray tap on the order list can't silently drop a sale. */
function confirmRemoveFromCart(idx){
  const it = state.register.cart[idx];
  if(!it) return;
  const html = `<div class="modal-title">Remove item?</div>
    <p style="text-align:center;color:var(--text-soft);font-size:14px;margin:0 0 4px;">Remove <strong style="color:var(--white);">${it.name}</strong> (${fmt(it.price)}) from this order?</p>
    <div class="modal-actions">
      <button class="modal-btn ghost" onclick="closeModal()">No</button>
      <button class="modal-btn primary" onclick="removeFromCart(${idx})">Yes, remove</button>
    </div>`;
  openModal(html);
}
function removeFromCart(idx){ state.register.cart.splice(idx,1); closeModal(); renderRegister(); }

/* Cap price lookup: cache-first (sheet.capPrices), else live ?lookup=cap&name=, else fallback. */
function selectCapType(type){
  const r = state.register;
  r.capMode = type;
  const cached = sheet.capPrices;
  if(cached && cached[type] != null){ r.capPrice = Number(cached[type]); r.capPriceLoading=false; renderRegister(); return; }
  r.capPriceLoading = true;
  renderRegister();
  const sheetName = type==='custom' ? 'custom cap' : 'regular cap';
  const fallback = CATALOG.caps.fallbackPrices[type];
  fetch(bustUrl(CONFIG.SHEET_URL + '?lookup=cap&name=' + encodeURIComponent(sheetName)), {cache:'no-store'}).then(res=>res.json()).then(data=>{
    r.capPrice = data.found ? Number(data.price) : fallback;
    r.capPriceLoading = false;
    renderRegister();
  }).catch(err=>{
    console.error('Cap price lookup failed:', err);
    r.capPrice = fallback; r.capPriceLoading = false; renderRegister();
  });
}
function setCapMode(mode){ selectCapType(mode); }
function setCapName(v){ state.register.capName = v; }
function addCap(){
  const r = state.register;
  const names = sheet.capNames || CATALOG.caps.fallbackNames;
  if(r.capMode==='custom'){
    const nm = r.capName.trim() || names.custom;
    addToCart(`${names.custom} "${nm.toUpperCase()}"`, r.capPrice, '--accent-orange');
    r.capName='';
  } else {
    addToCart(names.regular, r.capPrice, '--accent-orange');
  }
}

/* ================= PAYMENT / SUCCESS ================= */
let pendingCategory = 'tattoos';
let selectedMethod = null;
let paymentOrderExpanded = false;
// Set for the duration of one confirmPayment() submission and reset only when a genuinely NEW
// transaction reaches the Payment screen (here, the sole entry point into it). Guards against
// the Confirm Payment button firing more than once for the SAME tap: browsers — mobile Safari
// especially — can queue/replay a touch or click event that arrived while the page was busy or
// backgrounded, delivering it to confirmPayBtn again even after we've already moved on to the
// Success screen. Without this, each extra delivery re-runs confirmPayment() and logs another
// row to the sheet for a sale that only happened once.
let paymentSubmitting = false;
function goToPayment(){
  if(!state.register.cart.length) return;
  pendingCategory = state.register.category;
  selectedMethod = null;
  paymentOrderExpanded = false;
  paymentSubmitting = false;
  goto('payment');
}
function renderPayment(){
  const cart = state.register.cart;
  const total = cart.reduce((s,i)=>s+i.price,0);
  document.getElementById('payTotal').textContent = fmt(total);

  let orderHtml = `<button class="pill dark" onclick="togglePaymentOrder()"><span>${cart.length} item order</span><span class="arrow">${paymentOrderExpanded?'▼':'▶'}</span></button>`;
  if(paymentOrderExpanded){
    cart.forEach(it=>{
      orderHtml += `<div class="pay-item-row" style="--item-accent:var(${it.accentVar});"><span>${it.name}</span><span class="price">${fmt(it.price)}</span></div>`;
    });
  }
  document.getElementById('payOrderList').innerHTML = orderHtml;

  document.getElementById('payMethods').innerHTML = PAY_METHODS.map(m=>
    `<div class="method-row ${selectedMethod===m?'sel':''}" onclick="selectMethod('${m}')">${m}</div>`
  ).join('');

  document.getElementById('confirmPayBtn').classList.toggle('ready', !!selectedMethod);
}
function togglePaymentOrder(){ paymentOrderExpanded = !paymentOrderExpanded; renderPayment(); }
function selectMethod(m){ selectedMethod = m; renderPayment(); }
function confirmPayment(){
  if(!selectedMethod) return;
  if(paymentSubmitting) return; // already charging this transaction -- ignore a duplicate/replayed activation
  const cart = state.register.cart;
  if(!cart.length) return; // nothing left to charge -- guards a replayed activation arriving after the cart was already cleared
  paymentSubmitting = true;
  const total = cart.reduce((s,i)=>s+i.price,0);
  const orderId = '#' + (1043 + (sheet.ordersToday ? sheet.ordersToday.length : 0) + ORDERS.length);
  const itemsStr = cart.map(c=>'1× '+c.name).join(', ');
  const categories = Array.from(new Set(cart.map(c=> c.category==='others' ? 'other' : c.category))).join('/');
  // requestId: a per-sale-attempt fingerprint, unique even if this exact fetch gets silently
  // resent by the phone's network layer (observed on iPhone/Safari after a wifi/signal blip --
  // the sheet ends up with two rows for the same sale, a minute apart, each with its own row
  // number). The Apps Script side needs a small change to actually use this for de-duplication
  // (skip inserting a row if it already logged this requestId in the last few minutes) -- until
  // that's added there, this id is sent but not yet acted on server-side.
  const requestId = Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  logSaleToSheet({kiosk: state.currentKiosk, staff: state.staffName, items: itemsStr, category: categories, method: selectedMethod, total: total, requestId: requestId});
  // Reflect locally right away so Orders/Reports feel instant; refreshDailyTotals(true) below
  // reconciles against the sheet's authoritative totals shortly after.
  const now = new Date();
  let h12 = now.getHours()%12; if(h12===0) h12=12;
  const timeDisplay = h12+':'+String(now.getMinutes()).padStart(2,'0')+' '+(now.getHours()>=12?'pm':'am');
  ORDERS.unshift({ id:orderId, kioskId: state.currentKiosk, time:timeDisplay, method: selectedMethod, total: total,
    items: cart.map(c=>({name:c.name, qty:1, price:c.price, category:c.category})) });
  document.getElementById('successTotal').textContent = fmt(total);
  document.getElementById('successMeta').textContent = selectedMethod + ' · ' + cart.length + ' item(s)';
  document.getElementById('successCheer').textContent = getSaleMessage(total, state.staffName);
  state.register.cart = [];
  goto('success');
  playSuccessCheckAnimation();
  setTimeout(()=>refreshDailyTotals(true), 1200);
}
/* Replays the "circle draws, then check mark draws" animation, plus the cheer message's
   fade-up (timed to start right after the check mark finishes drawing — see the .75s delay
   on .success-cheer.animate), every time a sale completes — same remove/reflow/re-add trick
   as playHomeEntrance(), since these elements are reused across sales rather than re-created. */
function playSuccessCheckAnimation(){
  const el = document.getElementById('successCheck');
  const cheer = document.getElementById('successCheer');
  if(el){ el.classList.remove('animate'); void el.offsetWidth; el.classList.add('animate'); }
  if(cheer){ cheer.classList.remove('animate'); void cheer.offsetWidth; cheer.classList.add('animate'); }
}
function logSaleToSheet(sale){
  const params = new URLSearchParams({action:'logSale', kiosk:sale.kiosk, staff:sale.staff, items:sale.items, category:sale.category, method:sale.method, total:sale.total, requestId:sale.requestId||''});
  fetch(CONFIG.SHEET_URL + '?' + params.toString()).catch(err=>console.error('Sale log failed:', err));
}

/* Maps a stored order item's category back to that category's current accent color, the same
   way the register's cart items get their --item-accent — so an expanded order in Order
   History reads with the same per-product colors as Current Order, not a flat text line.
   Falls back to white for anything without a recognized category (e.g. a real-backend order
   row that only carries one combined items string, with no per-item category breakdown). */
function categoryAccentVar(category){

function parseHour(timeStr){
  if(!timeStr) return null;
  const m = String(timeStr).match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
  if(!m) return null;
  let h = parseInt(m[1],10);
  const ampm = m[3] ? m[3].toLowerCase() : null;
  if(ampm==='pm' && h<12) h+=12;
  if(ampm==='am' && h===12) h=0;
  return h;
}

/* ================= REPORTS =================
   Scoped to the active kiosk throughout — total/count/avg/payment mix AND category breakdown.
   Sourced from todaysOrders() (the sheet's per-kiosk order rows when available, else this
   session's local orders), never from the sheet's dt.categoryTotals field, which is a
   cross-kiosk aggregate across all 4 kiosks and would keep showing other kiosks' sales even
   after this kiosk's own data is deleted. */
/* A live sheet order row only carries one combined "1× X, 1× Y" items string and an order total
   (no per-item category or price breakdown) — see the ?lookup=todayOrders shape above. When a
   cart item carries its own category (orders placed on this device this session), that's used
   directly. Otherwise the category is inferred from the item name — matched against the actual
   live catalog data (sheet.capNames/braids/others), NOT guessed English keywords like "cap" or
   "braid": the sheet's own product names are whatever this business configured them as (e.g.
   Portuguese), so a name that doesn't literally contain the English word would otherwise fall
   through to Others even though it's a real Caps/Braids sale. Only tattoos are safe to detect by
   a fixed pattern ("#NN | Name"), since that prefix is generated by this app itself, not typed
   into the sheet. */
function categorizeItemName(name, explicitCategory){
  if(explicitCategory){
    return explicitCategory==='caps' ? 'Caps' : (explicitCategory==='braids' ? 'Braids' : (explicitCategory==='others' || explicitCategory==='other' ? 'Others' : 'Tattoos'));
  }
  const n = String(name||'').trim();
  if(/^#\d+/.test(n)) return 'Tattoos';
  const capNames = sheet.capNames || CATALOG.caps.fallbackNames;
  if(capNames){
    if(capNames.regular && n === capNames.regular) return 'Caps';
    // Custom caps append a quoted personalization to the base name, e.g. `${capNames.custom} "TEXT"`.
    if(capNames.custom && n.indexOf(capNames.custom) === 0) return 'Caps';
  }
  if(isTerereItem(n)) return 'Braids';
  const braidList = (sheet.braids && sheet.braids.length) ? sheet.braids : CATALOG.braids.fallbackItems;
  if(braidList.some(b=>b.name===n)) return 'Braids';
  const otherList = (sheet.others && sheet.others.length) ? sheet.others : CATALOG.others.fallbackItems;
  if(otherList.some(o=>o.name===n)) return 'Others';
  // Fallback keyword guesses only for the rare case catalog data hasn't loaded yet.
  if(/\bcap\b/i.test(n)) return 'Caps';
  if(/\bbraids?\b/i.test(n)) return 'Braids';
  return 'Others';
}
const CATEGORY_KEY_LOWER = {Tattoos:'tattoos', Braids:'braids', Caps:'caps', Others:'others'};
/* Recovers one item fragment's real price from the live catalog data — braids, Téréré sizes,
   caps (both are fixed sheet-configured prices, never staff-typed), the "Other" list, and
   tattoos (matched by the #NN number embedded in the name against the cached tattoo list).
   Returns null when a price genuinely can't be recovered (e.g. a tattoo number that isn't
   cached), which expandOrderItems() below treats as "unknown", not "zero". */
function priceOfFragment(name){
  const n = String(name||'').trim();
  const capNames = sheet.capNames || CATALOG.caps.fallbackNames;
  const capPrices = sheet.capPrices || CATALOG.caps.fallbackPrices;
  if(capNames){
    if(capNames.regular && n === capNames.regular) return Number(capPrices.regular) || null;
    if(capNames.custom && n.indexOf(capNames.custom) === 0) return Number(capPrices.custom) || null;
  }
  if(sheet.terere && sheet.terere.length){
    const t = sheet.terere.find(x=>x.name===n);
    if(t) return Number(t.price) || null;
  }
  const braidList = (sheet.braids && sheet.braids.length) ? sheet.braids : CATALOG.braids.fallbackItems;
  const bm = braidList.find(b=>b.name===n);
  if(bm) return Number(bm.price) || null;
  const otherList = (sheet.others && sheet.others.length) ? sheet.others : CATALOG.others.fallbackItems;
  const om = otherList.find(o=>o.name===n);
  if(om) return Number(om.price) || null;
  const tm = n.match(/^#(\d+)/);
  if(tm && sheet.tattoos && sheet.tattoos.length){
    const t = sheet.tattoos.find(x=>Number(x.number)===Number(tm[1]));
    if(t) return Number(t.price) || null;
  }
  return null;
}
/* Expands one order "item" into real per-product entries — {name, price, category, qty} each.
   A locally-placed item already carries its own category and exact price (single-entry
   passthrough). A live-sheet item is a squashed "1× X, 1× Y" string sharing one order total with
   no per-item price breakdown — this recovers each product's real price via priceOfFragment()
   (matched against the live catalog, not guessed) so a mixed order (e.g. two caps + a Téréré)
   splits into its real products, each under its own correct category, instead of the whole total
   landing under whichever category happened to be listed first. Only a fragment whose exact price
   can't be recovered (e.g. an uncached tattoo) shares the leftover amount evenly with any other
   unpriced fragments in the same order — every other fragment keeps its exact catalog price. */
function expandOrderItems(it){
  if(it.category) return [{ name: it.name, price: it.price, category: it.category, qty: it.qty||1 }];
  const frags = String(it.name||'').split(/,\s*/).map(s=>s.replace(/^\d+\s*[×x]\s*/i,'').trim()).filter(Boolean);
  if(!frags.length) return [{ name: it.name, price: it.price, category: 'others', qty: it.qty||1 }];
  const parsed = frags.map(f=>({ name:f, cat: categorizeItemName(f), price: priceOfFragment(f) }));
  const knownSum = parsed.reduce((s,p)=> s + (p.price!=null ? p.price : 0), 0);
  const unknown = parsed.filter(p=>p.price==null);
  const share = unknown.length ? (it.price - knownSum) / unknown.length : 0;
  return parsed.map(p=>({
    name: p.name,
    price: p.price!=null ? p.price : share,
    category: CATEGORY_KEY_LOWER[p.cat] || 'others',
    qty: 1,
  }));
}
/* Returns {category: amount} for one order "item", summed from its real expanded products (see
   expandOrderItems above) — every product price is a whole dollar amount, so a category total is
   an exact sum of real product prices, never a divided, decimal-cents figure. */
function itemCategoryShares(it){
  const out = {};
  expandOrderItems(it).forEach(p=>{
    const label = categorizeItemName(p.name, p.category);
    out[label] = (out[label]||0) + p.price;
  });
  return out;
}
function localOrdersTotals(){
  const orders = todaysOrders(); // already scoped to the active kiosk
  let total = 0; const catTotals = {Tattoos:0, Braids:0, Caps:0, Others:0}; const methodTotals = {};
  orders.forEach(o=>{
    o.items.forEach(it=>{
      total += it.price*it.qty;
      const shares = itemCategoryShares(it);
      Object.keys(shares).forEach(k=>{ catTotals[k] = (catTotals[k]||0) + shares[k]; });
    });
    methodTotals[o.method] = (methodTotals[o.method]||0) + o.total;
  });
  return { total, count: orders.length, catTotals, methodTotals };
}
/* Shared by Reports and Sale Details — both show the same category/payment breakdown for the
   active kiosk, just in different visual styles (bars vs. plain rows). */
function getCategoryTotals(){
  return localOrdersTotals().catTotals;
}
function getKioskTotal(){
  const dt = sheet.dailyTotals;
  const local = localOrdersTotals();
  const haveKioskTotal = !!(dt && dt.kioskTotals && dt.kioskTotals[state.currentKiosk] != null);
  return haveKioskTotal ? Number(dt.kioskTotals[state.currentKiosk]) : local.total;
}
function getPaymentTotals(){
  const kioskOrders = todaysOrders(); // already filtered to state.currentKiosk
  const sourceOrders = (sheet.ordersToday && sheet.ordersToday.length) ? kioskOrders : ORDERS.filter(o=>o.kioskId===state.currentKiosk);
  const methodTotals = {};
  sourceOrders.forEach(o=>{ methodTotals[o.method] = (methodTotals[o.method]||0) + o.total; });
  return methodTotals;
}
function renderReports(){
  // Today's Sales is scoped to the ACTIVE kiosk only, throughout — total/count/avg/payment-mix
  // AND category breakdown (cross-kiosk totals live in Admin > Kiosks instead). Category amounts
  // are inferred per order (see getCategoryTotals/itemCategoryShares above) since the live sheet
  // doesn't expose a category field per order row, only a combined items string.
  const dt = sheet.dailyTotals;
  const kioskOrders = todaysOrders(); // already filtered to state.currentKiosk
  const local = localOrdersTotals();
  const total = getKioskTotal();
  const count = (sheet.ordersToday && sheet.ordersToday.length) ? kioskOrders.length : local.count;
  const avg = count ? total/count : 0;
  document.getElementById('repTotal').textContent = fmt(total);
  document.getElementById('repOrders').textContent = count;
  document.getElementById('repAvg').textContent = fmt1(avg);

  const catTotals = getCategoryTotals();
  // Bar width is each category's share of the category total (not scaled to whichever
  // category happens to be largest), so the bars are readable as an actual percentage split.
  const sumCat = Object.values(catTotals).reduce((a,b)=>a+Number(b||0),0) || 1;
  document.getElementById('repCats').innerHTML = Object.keys(catTotals).map(name=>`
    <div class="bar-row"><div class="lbl"><span>${name}</span><span>${fmt(catTotals[name])}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(catTotals[name]/sumCat*100).toFixed(0)}%;background:var(--white);"></div></div></div>
  `).join('');

  // Payment mix: computed from this kiosk's own orders (either sheet- or locally-sourced,
  // both already filtered to state.currentKiosk), not from the cross-kiosk dt.methodTotals.
  // Bar width is each method's share of total payments, same percentage-of-whole logic as above.
  const methodTotals = getPaymentTotals();
  const payEntries = PAY_METHODS.filter(m=>methodTotals[m]);
  const sumPay = payEntries.reduce((a,m)=>a+Number(methodTotals[m]||0),0) || 1;
  document.getElementById('repPay').innerHTML = payEntries.map(m=>`
    <div class="bar-row"><div class="lbl"><span>${m}</span><span>${fmt(methodTotals[m])}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${(methodTotals[m]/sumPay*100).toFixed(0)}%;background:var(--accent-green);"></div></div></div>
  `).join('');
}
