    html += `<button class="add-row" id="refreshBtn" onclick="refreshSheetData(true); refreshDailyTotals(true);" ${state.settings.refreshBusy?'disabled':''}><span>↻ ${state.settings.refreshBusy ? 'Refreshing…' : 'Refresh data from sheet'}</span><span></span></button>`;
    html += `<div class="swatch-row"><span class="lbl">Show "Updating…" indicator</span><div class="seg" style="margin:0;width:140px;background:var(--card);"><button class="${state.settings.showUpdatingIndicator?'on':''}" onclick="setShowUpdating(true)">On</button><button class="${!state.settings.showUpdatingIndicator?'on':''}" onclick="setShowUpdating(false)">Off</button></div></div>`;

    html += `<div class="section-label">Login screen</div>`;
    html += `<div class="swatch-row"><span class="lbl">Require login on start</span><div class="seg" style="margin:0;width:140px;background:var(--card);"><button class="${state.settings.requireLogin?'on':''}" onclick="setRequireLogin(true)">Show</button><button class="${!state.settings.requireLogin?'on':''}" onclick="setRequireLogin(false)">Hide</button></div></div>`;

    html += `<div class="section-label">Auto log-off</div>`;
    html += `<div class="swatch-row" style="flex-direction:column;align-items:stretch;gap:10px;">
      <div style="display:flex;justify-content:space-between;"><span class="lbl">Idle timeout</span><span class="lbl" id="idleTimeoutVal">${state.settings.idleTimeoutSec} sec</span></div>
      <input type="range" class="settings-slider" min="10" max="180" step="5" value="${state.settings.idleTimeoutSec}" oninput="setIdleTimeout(this.value)">
    </div>`;

    html += `<div class="section-label">Home screen</div>`;
    html += `<div class="swatch-row"><span class="lbl">Tile entrance animation</span><div class="seg" style="margin:0;width:140px;background:var(--card);"><button class="${state.settings.homeAnimEnabled?'on':''}" onclick="setHomeAnimEnabled(true)">On</button><button class="${!state.settings.homeAnimEnabled?'on':''}" onclick="setHomeAnimEnabled(false)">Off</button></div></div>`;

    html += `<div class="section-label">Sale Complete screen</div>`;
    html += `<button class="pill dark" onclick="toggleSaleMsgSection()"><span>Staff cheer messages</span><span class="arrow">${state.admin.saleMsgOpen?'▼':'▶'}</span></button>`;
    if(state.admin.saleMsgOpen){
      html += `<div class="section-label" style="margin-top:10px;">Shown by sale total — use {name} for the staff member's first name.</div>`;
      state.settings.saleMessages.forEach((m,i)=>{
        html += `<div class="swatch-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span class="lbl" style="white-space:nowrap;">$${m.threshold}+</span>
            <input class="text-input" style="margin-bottom:0;width:64px;flex:none;text-align:center;" type="number" min="0" value="${m.threshold}" onchange="setSaleMsgThreshold(${i},this.value)">
            <input class="text-input" style="margin-bottom:0;flex:1;" value="${m.text.replace(/"/g,'&quot;')}" oninput="setSaleMsgText(${i},this.value)">
          </div>
        </div>`;
      });
      html += `<button class="modal-btn ghost" style="width:100%;margin-top:4px;" onclick="resetSaleMessages()">Reset to defaults</button>`;
    }
  }
  document.getElementById('adminBody').innerHTML = html;
}
function cssVarHex(name){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v.startsWith('#') ? v : '#434298';
}
function getDesignStore(){ try{ return JSON.parse(localStorage.getItem(DESIGN_KEY)) || {}; }catch(e){ return {}; } }
function saveDesignStore(d){ try{ localStorage.setItem(DESIGN_KEY, JSON.stringify(d)); }catch(e){} }
function setVar(name, val){
  document.documentElement.style.setProperty(name, val);
  const d = getDesignStore();
  d.vars = d.vars || {};
  d.vars[name] = val;
  saveDesignStore(d);
}
function setItemStyle(mode){
  state.itemStyle = mode;
  document.getElementById('app').classList.toggle('style-fill', mode==='fill');
  renderAdmin();
  const d = getDesignStore();
  d.itemStyle = mode;
  saveDesignStore(d);
}
/* Re-applies whatever was saved from the Design tab (item style + any custom color vars) —
   called once on boot so Admin > Design changes survive a reload/re-login, matching the
   ADMIN_PIN_KEY / ACTIVE_KIOSK_KEY persistence pattern already used elsewhere. */
function loadDesign(){
  try{
    const d = getDesignStore();
    if(d.itemStyle === 'fill' || d.itemStyle === 'border'){
      state.itemStyle = d.itemStyle;
    }
    // Applied unconditionally (not just inside the branch above) so a device with no saved
    // choice yet still gets the CSS class matching state.itemStyle's default, rather than
    // silently staying on the OLD default look until someone opens Admin > Design once.
    document.getElementById('app').classList.toggle('style-fill', state.itemStyle === 'fill');
    if(d.vars){
      Object.keys(d.vars).forEach(k => document.documentElement.style.setProperty(k, d.vars[k]));
    }
  }catch(e){}
}

/* ================= SETTINGS: admin code, sheet cache, login toggle, idle timeout ================= */
function setAdminCodeDraft(v){ state.settings.adminCodeDraft = v.replace(/[^0-9]/g,'').slice(0,4); }
function saveAdminCode(){
  const v = state.settings.adminCodeDraft;
  const msgEl = document.getElementById('adminCodeMsg');
  if(v.length!==4){ if(msgEl) msgEl.textContent = 'Enter 4 digits'; return; }
  setAdminPin(v);
  state.settings.adminCodeDraft = '';
  renderAdmin();
  const msgEl2 = document.getElementById('adminCodeMsg');
  if(msgEl2) msgEl2.textContent = 'Saved — new admin code is ' + v + ' (stored on this device only)';
}
function fmtTime(d){ return d ? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) : 'Never'; }
function showUpdatingBadge(on){
  if(!state.settings.showUpdatingIndicator) return;
  const badge = document.getElementById('updatingBadge');
  if(badge) badge.classList.toggle('hidden', !on);
}
/* Full catalog/staff/kiosk refresh — mirrors the live app's ?lookup=all + localStorage cache. */
function refreshSheetData(manual){
  if(manual){ state.settings.refreshBusy = true; state.settings.refreshMsg=''; renderAdmin(); showUpdatingBadge(true); }
  fetch(bustUrl(CONFIG.SHEET_URL + '?lookup=all'), {cache:'no-store'}).then(res=>res.json()).then(data=>{
    const cache = {
      tattoos: data.tattoos || [], braids: data.braids || [], staff: data.staff || [],
      kiosks: data.kiosks || [], capPrices: data.capPrices || CATALOG.caps.fallbackPrices,
      capNames: data.capNames || CATALOG.caps.fallbackNames, others: data.others || [],
      terere: extractTerereList(data),
      updatedAt: Date.now(),
    };
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){}
    Object.assign(sheet, { tattoos:cache.tattoos, braids:cache.braids, staff:cache.staff, kiosks:cache.kiosks,
      capPrices:cache.capPrices, capNames:cache.capNames, others:cache.others, terere:cache.terere, cacheUpdatedAt:cache.updatedAt });
    state.settings.lastSynced = new Date(cache.updatedAt);
    state.settings.refreshBusy = false;
    if(manual) state.settings.refreshMsg = 'Data refreshed';
    showUpdatingBadge(false);
    renderAdmin();
    updateDemoLoginVisibility();
  }).catch(err=>{
    console.error('Full sheet refresh failed:', err);
    state.settings.refreshBusy = false;
    if(manual) state.settings.refreshMsg = 'Refresh failed — check connection';
    showUpdatingBadge(false);
    renderAdmin();
    updateDemoLoginVisibility();
  });
}
/* Cross-kiosk daily totals + today's orders — refreshed on load and whenever Orders/Reports
   is opened, same cadence as the live app. */
let dailyRefreshBusy = false;
function refreshDailyTotals(manual){
  if(manual){ dailyRefreshBusy = true; showUpdatingBadge(true); }
  Promise.all([
    fetchWithTimeout(CONFIG.SHEET_URL + '?lookup=dailyTotals', 8000),
    fetchWithTimeout(CONFIG.SHEET_URL + '?lookup=todayOrders', 8000),
  ]).then(res=>Promise.all(res.map(r=>r.json()))).then(([totalsData, ordersData])=>{
    const daily = Object.assign({}, totalsData, {dateStr: new Date().toDateString(), updatedAt: Date.now()});
    try{ localStorage.setItem(DAILY_CACHE_KEY, JSON.stringify(daily)); }catch(e){}
    const mappedOrders = (ordersData.orders||[]).map(o=>({
      id:'#'+o.rowId, kioskId:o.kiosk, time:o.time, method:o.method, total:Number(o.total),
      items:[{name:o.items, qty:1, price:Number(o.total)}],
    }));
    try{ localStorage.setItem(ORDERS_CACHE_KEY, JSON.stringify({orders:mappedOrders, dateStr: daily.dateStr})); }catch(e){}
    sheet.ordersToday = mappedOrders;
    sheet.dailyTotals = daily;
    dailyRefreshBusy = false;
    showUpdatingBadge(false);
    if(state.screen==='orders') renderOrdersList();
    if(state.screen==='reports') renderReports();
    if(state.screen==='admin') renderAdmin();
  }).catch(err=>{
    console.error('Daily totals fetch failed:', err);
    dailyRefreshBusy = false;
    showUpdatingBadge(false);
  });
}
function setShowUpdating(v){ state.settings.showUpdatingIndicator = v; renderAdmin(); }
function setRequireLogin(v){ state.settings.requireLogin = v; renderAdmin(); }
function setIdleTimeout(v){
  state.settings.idleTimeoutSec = parseInt(v,10);
  const el = document.getElementById('idleTimeoutVal');
  if(el) el.textContent = state.settings.idleTimeoutSec + ' sec';
  resetIdleTimer();
}

/* Staff cheer messages (Sale Complete screen) — persisted the same way as itemStyle/design
   vars: saved on every edit, reloaded on boot so Admin's edits survive a reload/re-login. */
function saveSaleMessages(){ try{ localStorage.setItem(SALE_MSG_KEY, JSON.stringify(state.settings.saleMessages)); }catch(e){} }
function loadSaleMessages(){
  try{
    const raw = localStorage.getItem(SALE_MSG_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      if(Array.isArray(saved) && saved.length) state.settings.saleMessages = saved;
    }
  }catch(e){}
}
function toggleSaleMsgSection(){ state.admin.saleMsgOpen = !state.admin.saleMsgOpen; renderAdmin(); }
function setSaleMsgThreshold(i, v){
  const n = parseInt(v,10);
  state.settings.saleMessages[i].threshold = isNaN(n) ? 0 : n;
  saveSaleMessages();
}
function setSaleMsgText(i, v){
  state.settings.saleMessages[i].text = v;
  saveSaleMessages();
}
function resetSaleMessages(){
  state.settings.saleMessages = SALE_MESSAGE_DEFAULTS.map(m=>({...m}));
  saveSaleMessages();
  renderAdmin();
}
/* Picks the tier whose threshold is the highest one at-or-below the sale total (tiers are
   expected sorted ascending, but this sorts defensively in case Admin edited them out of
   order), then swaps {name} for the staff's first name. */
function getSaleMessage(total, staffName){
  const tiers = [...state.settings.saleMessages].sort((a,b)=>a.threshold-b.threshold);
  let msg = tiers[0] || SALE_MESSAGE_DEFAULTS[0];
  for(const t of tiers){ if(total >= t.threshold) msg = t; }
  const firstName = String(staffName||'').trim().split(' ')[0] || 'there';
  return (msg.text||'').replace(/\{name\}/gi, firstName);
}

/* Home screen tile entrance animation on/off — persisted the same way as the other Admin >
   Design/Settings toggles (auto-saved, no separate Save button). */
function setHomeAnimEnabled(v){
  state.settings.homeAnimEnabled = v;
  try{ localStorage.setItem(HOME_ANIM_KEY, v ? '1' : '0'); }catch(e){}
  renderAdmin();
}
function loadHomeAnimSetting(){
  try{
    const raw = localStorage.getItem(HOME_ANIM_KEY);
    if(raw != null) state.settings.homeAnimEnabled = raw === '1';
  }catch(e){}
}

/* ================= IDLE AUTO-LOGOUT =================
   Paused mid-transaction (cart has items, or Payment/Success is open) and while
   on the Login screen itself. Resets on taps, key presses, touches, wheel, and
   scroll — not just button clicks. */
let idleTimer = null;
function resetIdleTimer(){
  if(idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
  if(state.screen==='login') return;
  if(state.register.cart.length > 0) return;
  if(state.screen==='payment' || state.screen==='success') return;
  idleTimer = setTimeout(()=>{ doLogout(); }, state.settings.idleTimeoutSec * 1000);
}
['click','keydown','touchstart','wheel','mousemove'].forEach(evt=>{
  document.addEventListener(evt, resetIdleTimer, {passive:true});
});
document.addEventListener('scroll', resetIdleTimer, {passive:true, capture:true});

/* ================= INIT =================
   Loads cached sheet/staff/kiosk/order data from localStorage first (instant boot, works
   offline against slightly-stale data), renders, then kicks off a background live refresh —
   same order of operations as the live app. */
function loadCaches(){
  try{
    const savedKiosk = localStorage.getItem(ACTIVE_KIOSK_KEY);
    if(savedKiosk) state.currentKiosk = savedKiosk;
  }catch(e){}
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(raw){
      const cache = JSON.parse(raw);
      Object.assign(sheet, {
        tattoos: cache.tattoos||null, braids: cache.braids||null, others: cache.others||null,
        terere: cache.terere||null, capPrices: cache.capPrices||null, capNames: cache.capNames||null,
        staff: cache.staff||null, kiosks: cache.kiosks||null, cacheUpdatedAt: cache.updatedAt||null,
      });
    }
    const rawOrders = localStorage.getItem(ORDERS_CACHE_KEY);
    if(rawOrders){
      const oc = JSON.parse(rawOrders);
      if(oc.dateStr === new Date().toDateString()) sheet.ordersToday = oc.orders;
    }
    const rawDaily = localStorage.getItem(DAILY_CACHE_KEY);
    if(rawDaily){
      const daily = JSON.parse(rawDaily);
      if(daily.dateStr === new Date().toDateString()) sheet.dailyTotals = daily;
    }
    if(state.settings.lastSynced == null && sheet.cacheUpdatedAt) state.settings.lastSynced = new Date(sheet.cacheUpdatedAt);
  }catch(err){ console.error('Cache load failed:', err); }
}
function init(){
  loadCaches();
  applyKioskFromLink();
  loadDesign();
  loadSaleMessages();
  loadHomeAnimSetting();
  if(state.settings.requireLogin){ goto('login'); } else { goto('home'); renderWho(); }
  updateDemoLoginVisibility();
  refreshSheetData(false);
  refreshDailyTotals(false);
}
init();
</script>
